<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多維複合命盤 ． 時空塔羅 ． 生命靈數 ． 紫微天機融匯版</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7;
            --cream-light: #F7F3EB;
            --cream-dark: #EADBC8;
            --brown-text: #4A3E3D;
            --brown-accent: #8C786E;
            --white: #FFFFFF;
            --gold: #C5A880;
            --sage: #A39389;
            --red-alert: #C86B5D;
            --pink-bg: #FAF2F2;
            --pink-border: #E8C5C5;
            --dark-gold: #AA8C60;
            --purple-indigo: #5A4B6E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', serif, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--brown-text);
            line-height: 1.8;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--white);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(140, 120, 110, 0.08);
            border: 1px solid var(--cream-light);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 10px 0;
        }

        header h1 {
            font-size: 2rem;
            color: var(--brown-text);
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .title-divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 16px auto;
            position: relative;
        }
        .title-divider::after {
            content: "✦";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.6rem;
            color: var(--gold);
            background-color: var(--white);
            padding: 0 4px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--brown-accent);
            letter-spacing: 1.5px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 500;
        }

        .form-section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--brown-text);
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--cream-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--brown-accent);
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--cream-dark);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--brown-text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--brown-accent);
            box-shadow: 0 0 0 3px rgba(140, 120, 110, 0.15);
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .sub-type-container {
            display: none;
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--cream-dark);
            margin-top: 10px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--brown-text);
            margin-bottom: 0;
        }

        .radio-label input[type="radio"] {
            accent-color: var(--red-alert);
        }

        .partner-info-card {
            display: none;
            background-color: var(--pink-bg);
            border: 1px solid var(--pink-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .quick-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .tag-btn {
            background-color: var(--cream-light);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--brown-text);
            transition: all 0.2s;
        }

        .tag-btn.active, .tag-btn:hover {
            background-color: var(--brown-accent);
            color: var(--white);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--brown-accent);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .ritual-section {
            display: none;
            text-align: center;
            margin-top: 35px;
            padding: 35px 0 15px 0;
            background: var(--cream-light);
            border-radius: 24px;
            border: 1px dashed var(--brown-accent);
            overflow: hidden;
        }

        .ritual-title {
            font-size: 1.1rem;
            color: var(--brown-text);
            margin-bottom: 5px;
            font-weight: bold;
            padding: 0 20px;
        }

        .ritual-steps-hint {
            font-size: 1.25rem;
            color: var(--red-alert);
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 0 20px;
        }

        .scroll-deck-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px 40px 40px 40px; 
            margin: 15px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-deck-wrapper::-webkit-scrollbar {
            display: none;
        }

        .scroll-deck-container {
            display: flex;
            width: max-content;
            align-items: flex-end; 
            height: 280px; 
            position: relative;
            margin: 0 auto; 
            padding-left: 60px;
            padding-right: 60px;
        }

        .ritual-card {
            flex-shrink: 0;
            width: 130px;  
            height: 220px; 
            background: linear-gradient(135deg, #2E2423 0%, #140D0C 100%);
            border: 3px solid var(--gold); 
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transform: rotate(var(--rot)) translateY(var(--ty));
            transform-origin: center bottom; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-left: -65px; 
        }

        .ritual-card:first-child {
            margin-left: 0;
        }

        .ritual-card::before {
            content: "🔱";
            color: var(--gold);
            font-size: 2rem; 
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .ritual-card:hover {
            transform: rotate(var(--rot)) translateY(calc(var(--ty) - 45px)) scale(1.15);
            box-shadow: 0 25px 50px rgba(197, 168, 128, 0.7); 
            border-color: var(--white);
            z-index: 9999; 
        }

        .ritual-card.selected-drawn {
            visibility: hidden;
            pointer-events: none;
        }

        .shuffling-text {
            display: block;
            margin-top: 15px;
            font-size: 0.88rem;
            color: var(--brown-accent);
            font-style: italic;
            padding: 0 20px;
        }

        .result-section {
            display: none;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed var(--cream-dark);
        }

        .result-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--brown-text);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .array-display-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 35px;
        }

        .array-card-item {
            flex: 1;
            text-align: center;
        }

        .array-card-tag {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--white);
            background: var(--brown-accent);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .array-card-tag.conclusion-tag {
            background: var(--red-alert);
        }

        .waite-tarot-card-body {
            width: 100%;
            height: 200px;
            background: #1A1211;
            border: 3px solid var(--gold);
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        .waite-tarot-card-body img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .waite-tarot-card-body.reversed-visual {
            transform: rotate(180deg);
        }

        .array-card-name {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: var(--brown-text);
        }

        .divination-card {
            background: var(--cream-light);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(140, 120, 110, 0.03);
            border: 1px solid rgba(234, 219, 200, 0.6);
        }

        .card-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--cream-dark);
        }

        .tarot-badge { background: var(--brown-accent); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
        .wuxing-badge { background: var(--dark-gold); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
        .lack-badge { background: var(--red-alert); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
        .num-badge { background: var(--purple-indigo); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}

        .analysis-block { margin-bottom: 30px; text-align: justify; }
        .analysis-subtitle { font-weight: bold; color: var(--brown-text); margin-bottom: 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .analysis-text { font-size: 0.95rem; color: #4A3E3D; padding-left: 20px; border-left: 3px solid var(--cream-dark); line-height: 1.8; }
        
        .timeline-box {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 15px;
        }

        .timeline-item {
            background: var(--white);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--cream-dark);
        }

        .timeline-item-title {
            font-weight: bold;
            color: var(--brown-text);
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .timeline-item-title .pos-label {
            color: var(--red-alert);
            font-size: 0.85rem;
        }

        .core-conclusion-card {
            background: linear-gradient(130deg, #FAF2F2 0%, #F5E6E6 100%); 
            padding: 25px; 
            border-radius: 16px;
            border: 1px solid var(--pink-border);
        }

        .wuxing-grid-box {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            text-align: center;
            margin: 15px 0;
        }
        .wuxing-item {
            background: var(--white);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--cream-dark);
            font-size: 0.85rem;
        }
        .wuxing-item.highlight {
            border-color: var(--red-alert);
            background: #FFF5F5;
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .container { padding: 25px 20px; }
            .array-display-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
            .waite-tarot-card-body { height: 150px; }
            header h1 { font-size: 1.5rem; }
            header p { font-size: 0.85rem; }
            .ritual-card { width: 100px; height: 170px; margin-left: -50px; }
            .ritual-card::before { font-size: 1.5rem; }
            .scroll-deck-container { height: 220px; padding-left: 30px; padding-right: 30px;}
            .scroll-deck-wrapper { padding: 20px; }
            .wuxing-grid-box { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>多維複合東方天機命盤</h1>
        <div class="title-divider"></div>
        <p>融匯 78 張偉特時空塔羅、生命靈數矩陣與紫微斗數星盤，洞察宿命最直接的解答。</p>
    </header>

    <form id="oracleForm" onsubmit="startRitual(event)">
        <div class="form-section-title">👤 您的個人資料（本命盤根基）</div>
        <div class="form-row">
            <div class="form-group">
                <label for="username">您的姓名</label>
                <input type="text" id="username" placeholder="請輸入姓名" required>
            </div>
            <div class="form-group">
                <label for="gender">您的性別</label>
                <select id="gender" required>
                    <option value="男">男（乾造）</option>
                    <option value="女">女（坤造）</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="birthDate">出生日期（陽曆）</label>
                <input type="date" id="birthDate" required>
            </div>
            <div class="form-group">
                <label for="birthTime">出生時辰</label>
                <select id="birthTime" required>
                    <option value="不知道時辰">不知道時辰（由命理靈感定盤）</option>
                    <option value="子時 (23:00-01:00)">子時 (23:00-01:00)</option>
                    <option value="丑時 (01:00-03:00)">丑時 (01:00-03:00)</option>
                    <option value="寅時 (03:00-05:00)">寅時 (03:00-05:00)</option>
                    <option value="卯時 (05:00-07:00)">卯時 (05:00-07:00)</option>
                    <option value="辰時 (07:00-09:00)">辰時 (07:00-09:00)</option>
                    <option value="巳時 (09:00-11:00)">巳時 (09:00-11:00)</option>
                    <option value="午時 (11:00-13:00)">午時 (11:00-13:00)</option>
                    <option value="未時 (13:00-15:00)">未時 (13:00-15:00)</option>
                    <option value="申時 (15:00-17:00)">申時 (15:00-17:00)</option>
                    <option value="酉時 (17:00-19:00)">酉時 (17:00-19:00)</option>
                    <option value="戌時 (19:00-21:00)">戌時 (19:00-21:00)</option>
                    <option value="亥時 (21:00-23:00)">亥時 (21:00-23:00)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>想諮詢的命理範疇</label>
            <div class="quick-btn-group">
                <button type="button" class="tag-btn active" onclick="selectType('事業', this)">💼 事業財運</button>
                <button type="button" class="tag-btn" onclick="selectType('感情', this)">❤️ 感情正緣</button>
                <button type="button" class="tag-btn" onclick="selectType('健康', this)">🌿 健康氣血</button>
                <button type="button" class="tag-btn" onclick="selectType('學業', this)">🎓 學業考運</button>
                <button type="button" class="tag-btn" onclick="selectType('偏財', this)">🪙 投資偏財</button>
                <button type="button" class="tag-btn" onclick="selectType('近三個月整體運勢', this)">✨ 三個月大運</button>
            </div>
            <input type="hidden" id="divinationType" value="事業">

            <div class="sub-type-container" id="loveSubContainer">
                <label style="color: var(--red-alert); font-size: 0.8rem;">請選擇感情諮詢模式：</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="loveSubType" value="雙人合盤" checked onclick="togglePartnerCard(true)"> 💞 雙人命理合盤</label>
                    <label class="radio-label"><input type="radio" name="loveSubType" value="單純算感情運勢" onclick="togglePartnerCard(false)"> 🌹 單身/個人感情運</label>
                </div>
            </div>
        </div>

        <div class="partner-info-card" id="partnerCard">
            <div class="form-section-title" style="color: var(--red-alert); border-bottom-color: var(--pink-border); margin-top:0;">💞 緣分對象個人資料</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="partnerName" style="color: var(--red-alert);">對方姓名</label>
                    <input type="text" id="partnerName" placeholder="請輸入對方姓名">
                </div>
                <div class="form-group">
                    <label for="partnerGender" style="color: var(--red-alert);">對方性別</label>
                    <select id="partnerGender">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="partnerBirthDate" style="color: var(--red-alert);">對方生日（陽曆）</label>
                    <input type="date" id="partnerBirthDate">
                </div>
                <div class="form-group">
                    <label for="partnerBirthTime" style="color: var(--red-alert);">對方時辰</label>
                    <select id="partnerBirthTime">
                        <option value="不知道時辰">不知道時辰</option>
                        <option value="子時 (23:00-01:00)">子時</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group" id="questionField">
            <label for="question">您心中的具體困惑與願望</label>
            <textarea id="question" placeholder="請詳細訴說你的現狀、願望與困惑，這能讓磁場校準得更精確..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="initBtn">凝神 ． 開始占卜</button>
    </form>

    <div class="ritual-section" id="ritualSection">
        <p class="ritual-title">🔮 命運羅盤已依您的磁場推開 78 葉天機</p>
        <div class="ritual-steps-hint" id="stepHint">請憑直覺抽取第 1 張牌：【代表過去】</div>
        
        <div class="scroll-deck-wrapper">
            <div class="scroll-deck-container" id="cardContainer"></div>
        </div>
        <span class="shuffling-text">—— 左右滑動命運弧形卷軸，當前已抽取 <span id="drawCount">0</span> / 4 張卡牌 ——</span>
    </div>

    <div class="result-section" id="resultSectionBox">
        <h2 class="result-title">⚜️ 時空宿命多維複合大解盤報告 ⚜️</h2>
        <div id="resultContent"></div>
    </div>
</div>

<script>
    // 完整的78張經典偉特塔羅數據集（包含大阿爾克那與所有小阿爾克那，並融入五行屬性）
    const tarotDeck = [
        { name: "愚者", element: "風", keywords_up: "開始、自由、純真、冒險", keywords_rev: "魯莽、不負責任、盲目、阻礙", detail_up: "象徵一個嶄新的起點，不畏艱難的精神，勇敢地跨出舒適圈，帶著純粹的信任與熱情展開新旅程。", detail_rev: "暗示行動過於衝動、缺乏計畫、逃避現實責任，或是面臨因盲目樂觀而產生的不可測風險。", img: "https://upload.wikimedia.org/wikipedia/commons/0/0b/RWS_Tarot_00_Fool.jpg" },
        { name: "魔術師", element: "風", keywords_up: "創造力、專注、行動、潛能", keywords_rev: "幻覺、操縱、懷才不遇、計劃延誤", detail_up: "代表萬事俱備，具備強大的資源整合與顯化能力，能夠將理想透過技術與意志轉化為現實。", detail_rev: "表示才華遭到壓抑，或是身邊有人在利用資訊不對稱進行欺瞞、操縱，亦需提防能量分散。", img: "https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg" },
        { name: "女祭司", element: "水", keywords_up: "直覺、潛意識、智慧、神祕", keywords_rev: "膚淺、忽視直覺、理智過度、隱藏秘密", detail_up: "象徵內在的沉靜智慧、超群的直覺力，此時應當靜觀其變，聆聽內心深處的非理性指引。", detail_rev: "意味著你過度用理智算計而忽視了精神訊號，或者是內心有未被揭露的秘密引發了焦慮。", img: "https://upload.wikimedia.org/wikipedia/commons/8/88/RWS_Tarot_02_High_Priestess.jpg" },

    // 隨機初始化卡牌弧形卷軸位置
    function initDeck() {
        const container = document.getElementById('cardContainer');

        // 隨機打亂塔羅牌
        const shuffled = [...tarotDeck].sort(() => Math.random() - 0.5);
        
        const totalCards = 26; // 畫面上顯示26張形成扇形弧度
        for (let i = 0; i < totalCards; i++) {
            const cardEl = document.createElement('div');
            cardEl.className = 'ritual-card';
            
            // 計算弧形偏轉
            const mid = totalCards / 2;
            const rot = (i - mid) * 4; 
            const ty = Math.abs(i - mid) * 3;
            
            cardEl.style.setProperty('--rot', `${rot}deg`);
            cardEl.style.setProperty('--ty', `${ty}px`);
            
            cardEl.dataset.index = i;
            cardEl.onclick = () => drawCard(cardEl, shuffled[i]);
            container.appendChild(cardEl);
        }
    }

        selectedCards.push({

            reversed: isReversed,
            positionLabel: stepLabels[selectedCards.length]
        });

        const count = selectedCards.length;
        document.getElementById('drawCount').innerText = count;

        if (count < maxDraws) {

        let sum = nums.reduce((a, b) => a + b, 0);
        while (sum > 9) {
            sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
        }
        return sum;
    }

        const yearSum = 2 + 0 + 2 + 6; // 當前年份 2026
        let sum = yearSum + month + day;
        while (sum > 9) {
            sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
        }
        return sum;
    }

            1: "【1號開創星】天生具備強烈孤狼特質。流年数字 ${personalYear} 提示您，2026年是打破現狀、獨立門戶的變革年，切忌依賴他人。",
            2: "【2號合作星】心思極其細膩敏感。流年数字 ${personalYear} 提示您，當下需要靠合夥、溝通或退居幕後借力打力，不可強出頭。",
            3: "【3號創意星】思維跳躍，極具感官爆發力。流年数字 ${personalYear} 提示您，本年切忌三分鐘熱度，應將精力聚焦於技能變現。",
            4: "【4號穩定星】對安全感要求極高，有時流於固執。流年数字 ${personalYear} 提示您，2026必須建立起防禦防線，不可進行高風險投資。",
            5: "【5號自由星】天生不願受體制束縛。流年数字 ${personalYear} 提示您，2026年局勢變數極大，適應力將是您渡過難關的唯一武器。",
            6: "【6號遠見星】擅長照料他人，容易承擔過多責任。流年数字 ${personalYear} 提示您，本年需防範情感與金錢上的過度內耗。",
            7: "【7號真理星】生性多疑，善於鑽研分析。流年数字 ${personalYear} 提示您，不可聽信表面風光，必須徹查數據背後的真相。",
            8: "【8號權力星】天生具有商業與世俗顯化野心。流年数字 ${personalYear} 提示您，2026年正逢因果結算期，成敗皆在於先前奠定的德行。",
            9: "【9號智慧星】精神追求極高，但有時流於空想。流年数字 ${personalYear} 提示您，2026是斷捨離的週期，必須把懸空的計劃落地。"
        };

        const numInsight = numBooksInsights[lifePath].replace('${personalYear}', personalYear);

        // 5. 針對諮詢範疇給出直接、赤裸、一針見血的命理對位結論
        let grandConclusion = "";
        const finalCard = selectedCards[3]; // 天機總結牌

        if (divinationType === '事業') {
            grandConclusion = `您的日主為【${easternFate.dayMaster}】，命宮逢【${easternFate.ziweiStar}】。這代表您在事業上具備${easternFate.ziweiDesc.slice(0,15)}。結合總結牌【${finalCard.name}${finalCard.reversed ? '逆位' : '正位'}】，目前您諮詢的問題《${question}》核心死穴在於**「${finalCard.reversed ? finalCard.keywords_rev : card.keywords_up}」**。不要再試圖用常規的拖延戰術來應付，紫微流年四化警告您：${easternFate.sihua}。如果您當前五行缺乏【${lackElement[0] || '火'}】，則意味著缺乏核心推動力或貴人，必須在接下來的45天內，斬斷無效內耗，採取主動破局。`;
        } else if (divinationType === '感情') {
            grandConclusion = `命盤大運顯示您當前主命數為【${lifePath}】。針對您的感情困惑，總結牌落入【${finalCard.name}${finalCard.reversed ? '逆位' : '正位'}】（五行屬${finalCard.element}）。這非常赤裸地揭示出關係的底牌：**${finalCard.reversed ? finalCard.detail_rev : finalCard.detail_up}**。紫微命宮【${easternFate.ziweiStar}】暗示您在感情中往往過於${easternFate.ziweiDesc.slice(0,10)}。如果選擇雙人合盤，對方的磁場正在與您的生命靈數產生摩擦，2026流年數字為【${personalYear}】，這不是可以妥協將就的年份，真相大白之時，唯有保持心理獨立，才能真正掌握主導權。`;
        } else {
            grandConclusion = `針對您所祈願的《${question}》，多維複合矩陣給出最直接的揭示：主命數【${lifePath}】賦予您的先天特質在應對此問題時，容易被當前流年數字【${personalYear}】的運勢亂流所干擾。總結牌【${finalCard.name}】明確指示：**${finalCard.reversed ? finalCard.keywords_rev : finalCard.keywords_up}**。請配合五行最弱之【${lackStr}】進行行為補強，順應紫微【${easternFate.ziweiStar}】的守備或進攻法則，一切發生皆是業力顯化，唯有改變思維，方能逆天改命。`;
        }

        // 6. 報告組裝
        const htmlReport = `
            <div class="array-display-container">
                ${cardDisplayHtml}
            </div>

            <div class="divination-card">
                <div class="card-meta">
                    <span class="num-badge">☯️ 生命靈數：主命數 ${lifePath}</span>
                    <span class="num-badge">🔮 2026年流年：${personalYear}</span>
                    <span class="wuxing-badge">🪐 日主干支：${easternFate.dayMaster}</span>
                    <span class="tarot-badge">🌌 紫微主星：${easternFate.ziweiStar}</span>
                    <span class="lack-badge">⚠️ 五行缺失：${lackStr}</span>
                </div>

                <div class="analysis-block">
                    <div class="analysis-subtitle">🧬 【生命靈數全書】人格原力與流年亂流</div>
                    <div class="analysis-text">${numInsight}</div>
                </div>

                <div class="analysis-block">
                    <div class="analysis-subtitle">☸️ 【紫微斗數全書】命宮格局與四化決策</div>
                    <div class="analysis-text">
                        <strong>命宮星曜特質：</strong>${easternFate.ziweiDesc}<br>
                        <strong>天干天機警告：</strong>${easternFate.sihua}
                    </div>
                </div>

                <div class="analysis-block">
                    <div class="analysis-subtitle">⏳ 時空塔羅四維流轉軌跡</div>
                    <div class="timeline-box">
                        <div class="timeline-item">
                            <div class="timeline-item-title"><span>❶ 過去現狀：【${selectedCards[0].name} ． ${selectedCards[0].reversed ? '逆位' : '正位'}】</span><span class="pos-label">基石磁場</span></div>
                            <div class="analysis-text" style="font-size:0.9rem;">${selectedCards[0].reversed ? selectedCards[0].detail_rev : selectedCards[0].detail_up}</div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-item-title"><span>❷ 當前面臨：【${selectedCards[1].name} ． ${selectedCards[1].reversed ? '逆位' : '正位'}】</span><span class="pos-label">核心衝突</span></div>
                            <div class="analysis-text" style="font-size:0.9rem;">${selectedCards[1].reversed ? selectedCards[1].detail_rev : selectedCards[1].detail_up}</div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-item-title"><span>❸ 未來趨勢：【${selectedCards[2].name} ． ${selectedCards[2].reversed ? '逆位' : '正位'}】</span><span class="pos-label">命運分叉</span></div>
                            <div class="analysis-text" style="font-size:0.9rem;">${selectedCards[2].reversed ? selectedCards[2].detail_rev : selectedCards[2].detail_up}</div>
                        </div>
                    </div>
                </div>

                <div class="core-conclusion-card">
                    <div class="analysis-subtitle" style="color: var(--red-alert);">🔥 復合解盤：命理師一針見血直白斷言</div>
                    <div class="analysis-text" style="border-left-color: var(--red-alert); font-weight: 500; color: #2E2423;">
                        ${grandConclusion}
                    </div>
                </div>
            </div>
        `;

        document.getElementById('resultContent').innerHTML = htmlReport;
        const resultBox = document.getElementById('resultSectionBox');
        resultBox.style.display = 'block';
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
