<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖殿級時空塔羅 ． 命運大解盤</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght=400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FDFBF7;
            --cream-light: #F7F3EB;
            --cream-dark: #EADBC8;
            --brown-text: #4A3E3D;
            --brown-accent: #8C786E;
            --white: #FFFFFF;
            --gold: #C5A880;
            --sage: #A39389;
            --red-alert: #C86B5D;
            --pink-bg: #FAF2F2;
            --pink-border: #E8C5C5;
            --dark-gold: #AA8C60;
            --purple-indigo: #5A4B6E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif TC', serif, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--brown-text);
            line-height: 1.8;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--white);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(140, 120, 110, 0.08);
            border: 1px solid var(--cream-light);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 10px 0;
        }

        header h1 {
            font-size: 2rem;
            color: var(--brown-text);
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .title-divider {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 16px auto;
            position: relative;
        }
        .title-divider::after {
            content: "✦";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.6rem;
            color: var(--gold);
            background-color: var(--white);
            padding: 0 4px;
        }

        header p {
            font-size: 0.95rem;
            color: var(--brown-accent);
            letter-spacing: 1.5px;
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 500;
        }

        .form-section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--brown-text);
            margin: 25px 0 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--cream-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--brown-accent);
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--cream-dark);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--brown-text);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--brown-accent);
            box-shadow: 0 0 0 3px rgba(140, 120, 110, 0.15);
        }

        textarea {
            resize: none;
            height: 90px;
        }

        .sub-type-container {
            display: none;
            background: var(--bg-color);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--cream-dark);
            margin-top: 10px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--brown-text);
            margin-bottom: 0;
        }

        .radio-label input[type="radio"] {
            accent-color: var(--red-alert);
        }

        .partner-info-card {
            display: none;
            background-color: var(--pink-bg);
            border: 1px solid var(--pink-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .quick-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .tag-btn {
            background-color: var(--cream-light);
            border: 1px solid transparent;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--brown-text);
            transition: all 0.2s;
        }

        .tag-btn.active, .tag-btn:hover {
            background-color: var(--brown-accent);
            color: var(--white);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--brown-accent);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .ritual-section {
            display: none;
            text-align: center;
            margin-top: 35px;
            padding: 35px 0 15px 0;
            background: var(--cream-light);
            border-radius: 24px;
            border: 1px dashed var(--brown-accent);
            overflow: hidden;
        }

        .ritual-title {
            font-size: 1.1rem;
            color: var(--brown-text);
            margin-bottom: 5px;
            font-weight: bold;
            padding: 0 20px;
        }

        .ritual-steps-hint {
            font-size: 1.25rem;
            color: var(--red-alert);
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 0 20px;
        }

        .scroll-deck-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 40px 40px 40px 40px; 
            margin: 15px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-deck-wrapper::-webkit-scrollbar {
            display: none;
        }

        .scroll-deck-container {
            display: flex;
            width: max-content;
            align-items: flex-end; 
            height: 280px; 
            position: relative;
            margin: 0 auto; 
            padding-left: 60px;
            padding-right: 60px;
        }

        .ritual-card {
            flex-shrink: 0;
            width: 130px;  
            height: 220px; 
            background: linear-gradient(135deg, #2E2423 0%, #140D0C 100%);
            border: 3px solid var(--gold); 
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transform: rotate(var(--rot)) translateY(var(--ty));
            transform-origin: center bottom; 
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-left: -65px; 
        }

        .ritual-card:first-child {
            margin-left: 0;
        }

        .ritual-card::before {
            content: "👁️‍🗨️";
            color: var(--gold);
            font-size: 2rem; 
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .ritual-card:hover {
            transform: rotate(var(--rot)) translateY(calc(var(--ty) - 45px)) scale(1.15);
            box-shadow: 0 25px 50px rgba(197, 168, 128, 0.7); 
            border-color: var(--white);
            z-index: 9999; 
        }

        .ritual-card.selected-drawn {
            visibility: hidden;
            pointer-events: none;
        }

        .shuffling-text {
            display: block;
            margin-top: 15px;
            font-size: 0.88rem;
            color: var(--brown-accent);
            font-style: italic;
            padding: 0 20px;
        }

        .result-section {
            display: none;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px dashed var(--cream-dark);
        }

        .result-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: var(--brown-text);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .array-display-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 35px;
        }

        .array-card-item {
            flex: 1;
            text-align: center;
        }

        .array-card-tag {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--white);
            background: var(--brown-accent);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .array-card-tag.conclusion-tag {
            background: var(--red-alert);
        }

        .waite-tarot-card-body {
            width: 100%;
            height: 200px;
            background: #1A1211;
            border: 3px solid var(--gold);
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        .waite-tarot-card-body img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .waite-tarot-card-body.reversed-visual {
            transform: rotate(180deg);
        }

        .array-card-name {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            color: var(--brown-text);
        }

        .divination-card {
            background: var(--cream-light);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 20px rgba(140, 120, 110, 0.03);
            border: 1px solid rgba(234, 219, 200, 0.6);
        }

        .card-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--cream-dark);
        }

        .tarot-badge { background: var(--purple-indigo); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
        .direction-badge { background: var(--brown-accent); color: var(--white); padding: 4px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold;}
        .direction-badge.rev-style { background: var(--red-alert); }

        .analysis-block { margin-bottom: 30px; text-align: justify; }
        .analysis-subtitle { font-weight: bold; color: var(--brown-text); margin-bottom: 10px; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
        .analysis-text { font-size: 0.95rem; color: #4A3E3D; padding-left: 20px; border-left: 3px solid var(--cream-dark); line-height: 1.8; }
        
        .timeline-box {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 15px;
        }

        .timeline-item {
            background: var(--white);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--cream-dark);
        }

        .timeline-item-title {
            font-weight: bold;
            color: var(--brown-text);
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .timeline-item-title .pos-label {
            color: var(--red-alert);
            font-size: 0.85rem;
        }

        .core-conclusion-card {
            background: linear-gradient(130deg, #FAF2F2 0%, #F5E6E6 100%); 
            padding: 25px; 
            border-radius: 16px;
            border: 1px solid var(--pink-border);
        }

        .suggestion-list {
            margin-top: 15px;
            padding-left: 20px;
        }

        .suggestion-list li {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: var(--brown-text);
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; gap: 0; }
            .container { padding: 25px 20px; }
            .array-display-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
            .waite-tarot-card-body { height: 150px; }
            header h1 { font-size: 1.5rem; }
            header p { font-size: 0.85rem; }
            .ritual-card { width: 100px; height: 170px; margin-left: -50px; }
            .ritual-card::before { font-size: 1.5rem; }
            .scroll-deck-container { height: 220px; padding-left: 30px; padding-right: 30px;}
            .scroll-deck-wrapper { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>大師級十字聖殿解盤</h1>
        <div class="title-divider"></div>
        <p>運用經典偉特奧義秘術，穿透時空潛意識，直擊核心困惑的終極指引。</p>
    </header>

    <form id="oracleForm" onsubmit="startRitual(event)">
        <div class="form-section-title">👤 諮詢者基底資料（定心校準）</div>
        <div class="form-row">
            <div class="form-group">
                <label for="username">您的稱呼</label>
                <input type="text" id="username" placeholder="請輸入姓名或暱稱" required>
            </div>
            <div class="form-group">
                <label for="gender">您的性別</label>
                <select id="gender" required>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>諮詢範疇</label>
            <div class="quick-btn-group">
                <button type="button" class="tag-btn active" onclick="selectType('事業財運', this)">💼 事業財運</button>
                <button type="button" class="tag-btn" onclick="selectType('情感正緣', this)">❤️ 情感正緣</button>
                <button type="button" class="tag-btn" onclick="selectType('人生方向', this)">🌿 人生方向</button>
                <button type="button" class="tag-btn" onclick="selectType('決策抉擇', this)">🎓 決策抉擇</button>
                <button type="button" class="tag-btn" onclick="selectType('近月運勢', this)">✨ 近月整體運勢</button>
            </div>
            <input type="hidden" id="divinationType" value="事業財運">

            <div class="sub-type-container" id="loveSubContainer">
                <label style="color: var(--red-alert); font-size: 0.8rem;">請選擇感情諮詢模式：</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="loveSubType" value="雙人合盤解讀" checked onclick="togglePartnerCard(true)"> 💞 雙人關係能量連結</label>
                    <label class="radio-label"><input type="radio" name="loveSubType" value="單身狀態解讀" onclick="togglePartnerCard(false)"> 🌹 單身狀態/個人桃花</label>
                </div>
            </div>
        </div>

        <div class="partner-info-card" id="partnerCard">
            <div class="form-section-title" style="color: var(--red-alert); border-bottom-color: var(--pink-border); margin-top:0;">💞 關係對象資料</div>
            <div class="form-row">
                <div class="form-group">
                    <label for="partnerName" style="color: var(--red-alert);">對方稱呼</label>
                    <input type="text" id="partnerName" placeholder="請輸入對方稱呼">
                </div>
                <div class="form-group">
                    <label for="partnerGender" style="color: var(--red-alert);">對方性別</label>
                    <select id="partnerGender">
                        <option value="女">女</option>
                        <option value="男">男</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-group" id="questionField">
            <label for="question">您當前最渴望看透的困惑</label>
            <textarea id="question" placeholder="請詳細訴說你的現狀、目前的掙扎以及內心真實想探問的事，這能讓洗牌時的意念磁場更加凝聚精確..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="initBtn">凝神 ． 進入命運矩陣</button>
    </form>

    <div class="ritual-section" id="ritualSection">
        <p class="ritual-title">🔮 大師靈性洗牌完畢，78張時空牌陣已鋪展</p>
        <div class="ritual-steps-hint" id="stepHint">請憑直覺抽取第 1 張牌：【核心現狀】</div>
        
        <div class="scroll-deck-wrapper">
            <div class="scroll-deck-container" id="cardContainer"></div>
        </div>
        <span class="shuffling-text">—— 左右滑動命運卷軸，當前已屏息抽取 <span id="drawCount">0</span> / 4 張卡牌 ——</span>
    </div>

    <div class="result-section" id="resultSectionBox">
        <h2 class="result-title">⚜️ 大師級時間十字塔羅解盤報告 ⚜️</h2>
        <div id="resultContent"></div>
    </div>
</div>

<script>
    // 包含大阿爾克那與全套小阿爾克那的部分精選代表性牌組，確保78張完整結構可用之隨機原型
    const tarotDeck = [
        { name: "愚者", type: "大阿爾克那", keywords_up: "初生、未知的冒險、純粹與無限可能", keywords_rev: "盲目衝動、不顧後果的逃避、危險的開端", detail_up: "當前局勢正處於極其純粹的起始點。你不需要攜帶沉重的過往，這股能量允許你大膽破局，只要內心保有無畏的信任，新世界的大門正在敞開。", detail_rev: "你可能正在盲目樂觀。當前的行動缺乏宏觀的沙盤推演，一味地追求形式上的自由，反而容易讓自己直接墜入未知的盲點與現實的泥淖。", img: "https://upload.wikimedia.org/wikipedia/commons/0/0b/RWS_Tarot_00_Fool.jpg" },
        { name: "魔術師", type: "大阿爾克那", keywords_up: "極致的專注、萬事俱備、顯化潛能", keywords_rev: "資源錯配、資訊操縱、懷才不遇的幻覺", detail_up: "你手中已經掌握了解決問題的所有核心要素，無論是天賦還是外部資源。現在是全面將意識轉化為行動的黃金期，你的意志將直接塑造現實。", detail_rev: "小心包裝完美的謊言或過度承諾。這暗示身邊存在操縱局面的力量，或者你雖然空有滿腹計畫，卻卡在執行力的致命阻滯中。", img: "https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg" },
        { name: "女祭司", type: "大阿爾克那", keywords_up: "深層直覺、潛意識智慧、靜觀其變", keywords_rev: "刻意忽略直覺、精神緊繃、表象欺騙", detail_up: "此時無需向外盲目自證。內在的寂靜就是你最強大的武器。聆聽你靈魂深處對這件事的直覺，真相在迷霧背後早已清澈無比。", detail_rev: "你正在過度理智算計，這導致你與真實的核心答案背道而馳。不要試圖用表面邏輯去強行合理化你心中早已感到不安的抉擇。", img: "https://upload.wikimedia.org/wikipedia/commons/8/88/RWS_Tarot_02_High_Priestess.jpg" },

        element.classList.add('active');

        if (type === '情感正緣') {
            document.getElementById('loveSubContainer').style.display = 'block';
            togglePartnerCard(document.querySelector('input[name="loveSubType"]:checked').value === '雙人合盤解讀');

            document.getElementById('loveSubContainer').style.display = 'none';
            document.getElementById('partnerCard').style.display = 'none';
        }
    }

    function startRitual(event) {

            const rot = (i - mid) * 3; 
            const ty = Math.abs(i - mid) * 1.8;
            
            card.style.setProperty('--rot', `${rot}deg`);
            card.style.setProperty('--ty', `${ty}px`);
            
            card.onclick = () => drawCard(card, i);
            container.appendChild(card);
        }

        setTimeout(() => {
            const wrapper = document.querySelector('.scroll-deck-wrapper');
            wrapper.scrollLeft = (container.offsetWidth - wrapper.offsetWidth) / 2;
        }, 300);
    }

    function updateStepHint() {
        const count = drawnCards.length;
        document.getElementById('drawCount').innerText = count;
        if (count < 4) {
            document.getElementById('stepHint').innerText = `請憑直覺抽取第 ${count + 1} 張牌：【${positions[count].title}】`;
        } else {
            document.getElementById('ritualSection').style.display = 'none';
            generateMasterReport();
        }
    }

    function drawCard(cardElement, index) {
        if (drawnCards.length >= 4) return;
        
        // 從完整的數據庫中隨機挑選一張
        let poolCard = tarotDeck[Math.floor(Math.random() * tarotDeck.length)];
        // 確保不重複
        while(drawnCards.some(c => c.name === poolCard.name)) {
            poolCard = tarotDeck[Math.floor(Math.random() * tarotDeck.length)];
        }
        
        // 隨機判定正位 (true) 或逆位 (false)
        const isUpright = Math.random() > 0.35; 
        
        drawnCards.push({
            ...poolCard,
            isUpright: isUpright,
            positionInfo: positions[drawnCards.length]
        });
        
        cardElement.classList.add('selected-drawn');
        updateStepHint();
    }

    function generateMasterReport() {
        const name = document.getElementById('username').value;
        const gender = document.getElementById('gender').value;
        const divType = document.getElementById('divinationType').value;
        const question = document.getElementById('question').value;
        
        let html = `
            <div class="divination-card" style="background: var(--white); border: 2px solid var(--cream-dark); margin-bottom: 30px;">
                <p style="font-size: 1rem; font-weight: bold; margin-bottom: 10px;">⚖️ 聖殿法界磁場檔案</p>
                <p style="font-size: 0.95rem; color: var(--brown-accent);">
                    <strong>諮詢法相：</strong> ${name}（${gender}） &nbsp;&nbsp;|&nbsp;&nbsp; 
                    <strong>探問範疇：</strong> ${divType} <br>
                    <strong>盤問核心意念：</strong> 「${question}」
                </p>
            </div>
            
            <div class="array-display-container">
        `;
        
        // 四張牌陣的視覺呈現
        drawnCards.forEach(card => {
            html += `
                <div class="array-card-item">
                    <span class="array-card-tag">${card.positionInfo.tag}</span>
                    <div class="waite-tarot-card-body ${card.isUpright ? '' : 'reversed-visual'}">
                        <img src="${card.img}" alt="${card.name}">
                    </div>
                    <p class="array-card-name">${card.name} ．（${card.isUpright ? '正位' : '逆位'}）</p>
                </div>
            `;
        });
        
        html += `</div>`;
        
        // 四張牌卡逐一詳細解析
        html += `<h3 style="font-size: 1.2rem; color: var(--brown-text); margin: 35px 0 15px 0; font-weight: 700; text-align: center;">✦ 四大時空象限深度剝離 ✦</h3>`;
        
        drawnCards.forEach(card => {
            const keywords = card.isUpright ? card.keywords_up : card.keywords_rev;
            const detail = card.isUpright ? card.detail_up : card.detail_rev;
            
            html += `
                <div class="divination-card">
                    <div class="card-meta">
                        <span class="tarot-badge">${card.positionInfo.title}</span>
                        <span class="direction-badge ${card.isUpright ? '' : 'rev-style'}">${card.name} 🤔 ${card.isUpright ? '正位核心顯化' : '逆位能量阻滯'}</span>
                    </div>
                    <div class="analysis-block">
                        <div class="analysis-subtitle">🔮 潛意識顯化意象</div>
                        <p class="analysis-text" style="color: var(--red-alert); font-weight: bold; letter-spacing: 1px;">「${keywords}」</p>
                    </div>
                    <div class="analysis-block">
                        <div class="analysis-subtitle">👁️‍🗨️ 大師精確剝離解析</div>
                        <p class="analysis-text">${detail}</p>
                    </div>
                </div>
            `;
        });
        
        // 綜合大解析
        html += `
            <div class="divination-card core-conclusion-card" style="margin-top: 40px;">
                <div class="analysis-subtitle" style="color: var(--purple-indigo); font-size: 1.2rem;">⚜️ 聖殿占卜師全局綜合判詞</div>
                <p style="font-size: 1rem; color: var(--brown-text); text-align: justify; margin-top: 15px; font-weight: 500;">
                    看著眼前鋪展開來的四股能量線，你的靈魂圖譜非常清晰。從【${drawnCards[2].name}】的根源演變，到你目前在【${drawnCards[0].name}】中所面臨的無形張力，無一不在揭示你此時此刻的卡點。
                    【${drawnCards[1].name}】作為你當前最隱蔽的致命盲點，正在瘋狂消耗你原本清澈的直覺；如果你持續忽視這個限制性的內部盲區，未來的能量軌道將會被不可避免地導向【${drawnCards[3].name}】的宿命終結點。
                    這不是不可更改的死局，塔羅的本質從來不是宿命論，而是當前集體無意識的精準切片。既然看清了能量的流向，你現在就擁有親手重塑未來的至高權利。
                </p>
            </div>
        `;
        
        // 大師提出的10點強勢命運建議
        html += `
            <div class="divination-card" style="border-left: 4px solid var(--red-alert); background: var(--bg-color);">
                <div class="analysis-subtitle" style="color: var(--red-alert); font-size: 1.15rem;">📌 針對此局大師給予的十點破局天機</div>
                <ul class="suggestion-list">
                    <li><strong>第一點：正視現狀背後的真實代價。</strong> 停止試圖粉飾當前的風平浪靜，你必須承認底層有些東西已經徹底變質。</li>
                    <li><strong>第二點：親手斬斷無謂的能量寄生。</strong> 在這個局裡，有些不健康的依賴或人際糾纏正在瘋狂吸食你的創造力，立刻劃清界線。</li>
                    <li><strong>第三點：破除盲目追求形式自由的幼稚幻覺。</strong> 真正的自由是建立在強大的現實紀律與物質基底之上的，否則只是逃避現實的藉口。</li>
                    <li><strong>第四點：啟動內在隱藏的智慧，而非向外盲目求援。</strong> 最核心的答案你其實早就心知肚明，停止在外界的喧囂中尋找合理化藉口。</li>
                    <li><strong>第五點：高度警惕身邊那些包裝精美的承諾。</strong> 如果有人給予你過度完美的預期，背後極大機率隱藏著高密度的資訊操縱與剝削。</li>
                    <li><strong>第六點：把犧牲用在具有現實價值的刀口上。</strong> 停止無謂的自我感動，那些無法為你帶來實質心靈成長或現實回報的忍耐，全部是瞎忙。</li>
                    <li><strong>第七點：容許不合時宜的舊結構徹底走向寂滅。</strong> 已經死去的感情、項目或思維模式就讓它被埋葬，騰出最乾淨的土壤才能迎接新生。</li>
                    <li><strong>第八點：重新拿回你的理智主權。</strong> 把偏激、委屈與憤怒等情緒全面剝離，用冷酷、客觀的視角重新進行利益與代價的盤點。</li>
                    <li><strong>第九點：在暴風雨來臨前，嚴密構築你的核心防線。</strong> 局勢的餘震仍在持續，收斂你的好大喜功，把資源全部收攏回最核心的安全區。</li>
                    <li><strong>第十點：永遠記住，你是命運的唯一掌舵者。</strong> 命運的齒輪雖然轉動，但如何走過高山低谷，全看你此時此刻決策的骨氣與魄力。</li>
                </ul>
            </div>
        `;
        
        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('resultSectionBox').style.display = 'block';
        
        // 重置按鈕
        document.getElementById('initBtn').disabled = false;
        document.getElementById('initBtn').innerText = "凝神 ． 重新校準占卜";
        
        // 平滑滾動到報告起點
        setTimeout(() => {
            document.getElementById('resultSectionBox').scrollIntoView({ behavior: 'smooth' });
        }, 200);
    }
</script>

</body>
</html>
